name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test geometry, lifecycle, logging and diagnostics
        env:
          HARU_TEST_OUTPUT: ${{ runner.temp }}/haru-tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: make test
      - name: Validate Python tooling syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/haru-bytecode
        run: python3 -m compileall -q scripts Tests
      - name: Clean test artifacts
        if: ${{ always() }}
        run: rm -rf -- "${RUNNER_TEMP:?}/haru-tests" "${RUNNER_TEMP:?}/haru-bytecode"
